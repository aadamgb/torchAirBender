name: trajectory_tracking
# name: tt_test


nn: [16, 128, 128, 4]
lr: 1e-3

target_boundary: 3.0
termination_penalty: 10.0

loss_weights:
  pos: 1.5
  vel: 1.0
  att: 0.1
  body_rates: 0.1


traj:
  num_harmonics: 2  # must be integer
  z_offset: 2.0
  A: 1.0
  w: 1.0
  phi: 2.0

max_dist_to_target: 4.0