name: ctbr
abbr: ctbr

encoder: [7, 16, 16, 3]
policy: [16, 128, 128, 4]

# policy: [19, 128, 128, 5] # for the geometric controller collective thrust + quaternions = 5

lr: 1e-3


loss_weights:
  pos: 2.0
  vel: 1.0
  att: 0.2
  body_rates: 0.1


traj:
  num_harmonics: 3  # must be integer
  z_offset: 2.0
  A: 1.0
  w: 1.0
  phi: 2.0
  dt: 0.01

max_dist_to_target: 5.0
rmse_threshold: 0.15

max_TTWR: 2.0
max_mass_norm_thrust: 3.0
# # For the CTBR controller
kp_rate: 1.0
w_max: 5.0