name: racing
abbr: racing

policy: [21, 128, 128]   # only input and hidden layers

lr: 1e-3

# loss_weights:
#   pos: 2.0
#   vel: 1.0
#   quat: 0.2
#   omega: 0.1
#   thrust: 0.01

loss_weights:
  pos: 2.0
  vel: 1.0
  att: 0.2
  body_rates: 0.2


traj:
  num_harmonics: 3  # must be integer
  z_offset: 3.0
  A: 1.0
  w: 1.5
  phi: 2.0
  dt: 0.01

max_dist_to_target: 5.0
rmse_threshold: 0.15


w_increase: 0.1

# # For the CTBR controller
kp_rate: 0.2
w_max: 5.0

load_traj: True
test_traj: "/home/adame/torchAirBender/miscellaneous/trajectories/TOGT/aos_togt_traj.csv"


max_mass_norm_thrust: 3.5



# --- Noise added to Quad's States --
#     |->  a.k.a measurment noise
m_noise:
  # variance (sigma^2)
  p_std: 0.05         # m
  v_std: 0.08         # m/s
  q_std: 0.001        # -
  w_std: 0.02         # rad/s
  
  # bias
  v_bias_std: 0.03    # m
  w_bias_std: 0.005   # rad/s