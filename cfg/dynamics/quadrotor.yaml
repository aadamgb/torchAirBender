name: quadrotor

# === Domain Randomization ===
# dr : True
# ============================

# Scale factor — drives correlated parameter sampling across envs
# sf:
#   nominal: 0.5
#   min: 0.0
#   max: 1.0
sf:
  nominal: 0.5
  min: 0.5
  max: 0.5

# Noise factor applied on top of correlated scaling
nf: 0.0 #0.05  


# -----------------------------
# Phsical Params
# -----------------------------

# Arm length [m] — primary geometric parameter, correlates mass/inertia
arm_length:
  nominal: 0.15
  min: 0.10
  max: 0.25

arm_angle: 
  nominal: 45.0 # [deg]  (X-config)
  min: 45.0 
  max: 45.0 
# arm_angle: 
#   nominal: 0.0 # [deg]  (X-config)
#   min: 0.0 
#   max: 0.0 

# Mass [kg]
mass:
  nominal: 0.5
  min: 0.3
  max: 0.8

# Inertia [kg·m^2] — diagonal elements [Ixx, Iyy, Izz]
inertia:
  xx:
    nominal: 0.0023
    min: 0.0010
    max: 0.0040
  yy:
    nominal: 0.0023
    min: 0.0010
    max: 0.0040
  zz:
    nominal: 0.0040
    min: 0.0020
    max: 0.0060

# Drag-torque coefficient: tau = km * Fz = km * kf * Omega^2
km:
  nominal: 0.012
  min: 0.009
  max: 0.015



max_thrust: 2.5   #per rotor
# max_thrust: 2.0