hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - env=tt
    - num_envs=1024
    - steps=800
    - cm=srt,ctbr,lvyr.lvyr+g
    - episodes=20
  job:
    name: train
    chdir: null
    override_dirname: cm=srt,ctbr,lvyr.lvyr+g,env=tt,episodes=20,num_envs=1024,steps=800
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /home/adame/torchAirBender
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/adame/torchAirBender/cfg
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      renderer: replay
      dynamics: a300
      env: tt
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
env:
  name: trajectory_tracking
  abbr: tt
  encoder:
  - 7
  - 16
  - 16
  - 3
  policy:
  - 16
  - 128
  - 128
  lr: 0.001
  loss_weights:
    pos: 2.0
    vel: 1.0
    att: 0.2
    body_rates: 0.1
  traj:
    num_harmonics: 3
    z_offset: 2.0
    A: 1.0
    w: 1.0
    phi: 2.0
    dt: 0.01
  max_dist_to_target: 5.0
  rmse_threshold: 0.15
  max_TWR: 2.0
  kp_rate: 1.0
  w_max: 5.0
dynamics:
  name: quadrotor
  sf:
    nominal: 0.5
    min: 0.5
    max: 0.5
  nf: 0.01
  arm_length:
    nominal: 0.15
    min: 0.149
    max: 0.151
  arm_angle:
    nominal: 45.0
  mass:
    nominal: 1.21
    min: 1.2
    max: 1.22
  inertia:
    xx:
      nominal: 0.018
      min: 0.017
      max: 0.019
    yy:
      nominal: 0.018
      min: 0.017
      max: 0.019
    zz:
      nominal: 0.037
      min: 0.036
      max: 0.039
  km:
    nominal: 0.012
    min: 0.011
    max: 0.013
  max_rotor_thrust: 20.5
  min_rotor_thrust: 0.5
  max_TWR: 6.9
renderer:
  name: replay
  window_width: 1280
  window_height: 720
device: cuda
dt: 0.01
cm: ctbr
num_envs: 1024
episodes: 20
steps: 800
truncation: 50
