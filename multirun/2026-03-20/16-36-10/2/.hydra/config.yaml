env:
  name: tt_plus_am
  abbr: ttpam
  encoder:
  - 7
  - 16
  - 16
  - 3
  policy:
  - 16
  - 128
  - 128
  lr: 0.001
  loss_weights:
    pos: 2.0
    vel: 1.0
    att: 0.2
    body_rates: 0.1
  traj:
    num_harmonics: 3
    z_offset: 2.0
    A: 1.5
    w: 1.0
    phi: 2.0
    dt: ${dt}
  max_dist_to_target: 5.0
  rmse_threshold: 0.15
  kp_rate: 1.0
  w_max: 5.0
dynamics:
  name: quadrotor
  sf:
    nominal: 0.5
    min: 0.0
    max: 1.0
  nf: 0.1
  arm_length:
    nominal: 0.15
    min: 0.1
    max: 0.2
  arm_angle:
    nominal: 45.0
  mass:
    nominal: 1.21
    min: 0.5
    max: 2.5
  inertia:
    xx:
      nominal: 0.018
      min: 0.009
      max: 0.04
    yy:
      nominal: 0.018
      min: 0.009
      max: 0.04
    zz:
      nominal: 0.037
      min: 0.015
      max: 0.06
  km:
    nominal: 0.012
    min: 0.008
    max: 0.02
  max_TWR: 6.9
renderer:
  name: replay
  window_width: 1280
  window_height: 720
cm: lvyr
device: cuda
dt: 0.01
num_envs: 1024
episodes: 50
steps: 1200
truncation: 50
